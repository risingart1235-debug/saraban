<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ — ลงรับหนังสือราชการ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap" style="max-width:420px; padding-top:44px">
  <div style="text-align:center; margin-bottom:20px">
    <div style="font-size:44px">📚</div>
    <h1 style="color:var(--blue); font-size:20px; margin:8px 0 2px">ระบบลงรับหนังสือราชการ</h1>
    <p class="tiny">โรงเรียนบ้านโพนทองประชาอุทิศ</p>
  </div>

  <!-- ขอเลขหนังสือส่ง — ครูขอเองได้โดยไม่ต้องมีบัญชี จึงต้องอยู่หน้านี้ -->
  <div class="card" style="border-color:#f59e0b; background:#fffbeb">
    <button id="sendToggle" style="display:flex; align-items:center; justify-content:space-between;
        gap:8px; width:100%; min-height:46px; padding:0; background:none; border:0;
        font-family:inherit; font-size:16px; font-weight:700; color:#92400e; cursor:pointer">
      <span>📤 ขอเลขหนังสือส่ง</span><span id="sendCaret">▾</span>
    </button>
    <p class="tiny" id="sendHint" style="margin:2px 0 0; color:#92400e">
      ไม่ต้องเข้าสู่ระบบ — กรอกให้ครบแล้วระบบจะออกเลขให้ทันที
    </p>

    <div id="sendPanel" class="hidden" style="margin-top:14px">
      <div id="sendMsg" class="hidden"></div>
      <div id="sendForm">
        <label for="sSender">ผู้ขอ / เจ้าของเรื่อง
          <span class="tiny">(ไว้ติดตาม — ในทะเบียนช่อง "จาก" เป็น ผอ. เสมอ)</span></label>
        <input id="sSender" type="text" placeholder="เช่น ครูสมชาย (ฝ่ายวิชาการ)">
        <label for="sTo">เรียน / ถึง <span class="tiny">(หน่วยงานปลายทาง)</span></label>
        <input id="sTo" type="text" placeholder="เช่น ผอ.สพป.สกลนคร เขต ๑">
        <label for="sTitle">เรื่อง</label>
        <input id="sTitle" type="text" placeholder="เช่น ขอความอนุเคราะห์วิทยากร">
        <label for="sDate">ลงวันที่</label>
        <input id="sDate" type="date">
        <p class="tiny" id="sDateThai" style="margin:4px 0 0"></p>
        <button class="btn" id="sSubmit" style="margin-top:16px">ขอเลข</button>
        <p class="tiny" style="margin-top:10px">
          ⚠️ เลขที่ได้จะถูกบันทึกลงทะเบียนหนังสือส่งทันที ขอแล้วยกเลิกเองไม่ได้
        </p>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:22px">
    <div id="err" class="err hidden"></div>
    <form id="f">
      <label for="u">ชื่อผู้ใช้</label>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="p">รหัสผ่าน</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="margin-top:18px">เข้าสู่ระบบ</button>
    </form>
  </div>

    <p class="tiny" style="text-align:center; margin-top:16px">
      ยังไม่มีบัญชี? <a href="/register" style="color:var(--blue); font-weight:700">สมัครสมาชิก</a>
      <br>(สมัครแล้วรอผู้ดูแลอนุมัติก่อนใช้งาน)
    </p>

</div>

<script>
const f = document.getElementById('f');
const err = document.getElementById('err');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('hidden');
  const btn = f.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const body = new URLSearchParams({
      username: document.getElementById('u').value,
      password: document.getElementById('p').value,
    });
    const r = await fetch('/login', { method: 'POST', body });
    const d = await r.json();
    if (d.ok) {
      location.href = '/';
      return;
    }
    err.textContent = d.error || 'เข้าสู่ระบบไม่สำเร็จ';
    err.classList.remove('hidden');
  } catch (ex) {
    err.textContent = 'ติดต่อเซิร์ฟเวอร์ไม่ได้: ' + ex.message;
    err.classList.remove('hidden');
  }
  btn.disabled = false;
  btn.textContent = 'เข้าสู่ระบบ';
});

// ---------- ขอเลขหนังสือส่ง (ไม่ต้องล็อกอิน) ----------
const $ = (id) => document.getElementById(id);
function esc(v) {
  return String(v == null ? '' : v)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

// ---- ช่องปฏิทิน ----
// เบราว์เซอร์แสดงปฏิทินเป็น ค.ศ. เสมอ (เปลี่ยนไม่ได้) จึงโชว์วันที่ไทยกำกับไว้ใต้ช่อง
// ผู้ใช้จะได้เห็นชัดว่าที่จะบันทึกลงทะเบียนคือวันไหน
const THAI_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                  'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thaiNum = (s) => String(s).replace(/[0-9]/g, (c) => '๐๑๒๓๔๕๖๗๘๙'[c]);

function thaiDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '';
  return thaiNum(+m[3] + ' ' + THAI_MON[+m[2] - 1] + ' ' + (+m[1] + 543));
}

function showThaiDate() {
  const t = thaiDate($('sDate').value);
  $('sDateThai').textContent = t ? 'จะบันทึกเป็น: ' + t : '';
}

// ตั้งค่าเริ่มต้นเป็นวันนี้ (ตามเวลาเครื่องผู้ใช้ ซึ่งอยู่ไทยอยู่แล้ว)
(() => {
  const n = new Date();
  const pad = (x) => String(x).padStart(2, '0');
  $('sDate').value = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  showThaiDate();
})();
$('sDate').addEventListener('change', showThaiDate);

$('sendToggle').onclick = () => {
  const open = $('sendPanel').classList.toggle('hidden');
  $('sendCaret').textContent = open ? '▾' : '▴';
  if (!open) $('sSender').focus();
};

// ขอเลขได้ทีละเลข พอได้แล้วฟอร์มจะถูกซ่อน ต้องกด "ตกลง" ก่อนถึงจะขอเลขต่อไปได้
// (เจตนาให้กดสองจังหวะ กันกดรัวจนเผาเลขทะเบียนทิ้ง)
function sendAgain() {
  $('sendMsg').classList.add('hidden');
  $('sendForm').classList.remove('hidden');
  $('sendHint').classList.remove('hidden');
  // คงชื่อผู้ขอกับวันที่ไว้ เพราะคนเดิมมักขอหลายเลขรวดเดียวในวันเดียวกัน
  $('sTo').value = '';
  $('sTitle').value = '';
  const b = $('sSubmit');
  b.disabled = false; b.textContent = 'ขอเลข';
  $('sTo').focus();
}

$('sSubmit').onclick = async () => {
  const m = $('sendMsg');
  const body = {
    requester: $('sSender').value.trim(),
    to: $('sTo').value.trim(),
    title: $('sTitle').value.trim(),
    doc_date: $('sDate').value.trim(),
  };
  // เช็คในเครื่องก่อน จะได้ไม่ต้องรอเซิร์ฟเวอร์บอก (เซิร์ฟเวอร์ก็เช็คซ้ำอยู่ดี)
  const need = [];
  if (!body.requester) need.push('ผู้ขอ / เจ้าของเรื่อง');
  if (!body.to) need.push('เรียน / ถึง');
  if (!body.title) need.push('เรื่อง');
  if (need.length) {
    m.className = 'err'; m.classList.remove('hidden');
    m.textContent = 'กรอกให้ครบก่อนจึงจะออกเลขให้: ' + need.join(' · ');
    return;
  }

  const b = $('sSubmit');
  b.disabled = true; b.textContent = 'กำลังขอเลข...';
  m.classList.add('hidden');
  try {
    const r = await fetch('/api/send/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) });
    const text = await r.text();
    let d = {};
    try { d = JSON.parse(text); } catch (e) { throw new Error('เซิร์ฟเวอร์ผิดพลาด (' + r.status + ')'); }
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'ขอเลขไม่สำเร็จ');

    // สำเร็จแล้วซ่อนฟอร์ม กันกดซ้ำจนได้เลขเกินมาโดยไม่ตั้งใจ
    $('sendForm').classList.add('hidden');
    $('sendHint').classList.add('hidden');
    m.className = 'ok'; m.classList.remove('hidden');
    m.innerHTML = '<b>ได้เลขหนังสือส่งแล้ว</b>'
      + '<div style="font-size:30px;font-weight:700;color:var(--purple);margin:8px 0">'
      + esc(d.no) + '</div>'
      + 'เลขที่หนังสือ: <b>' + esc(d.doc_no) + '</b><br>'
      + 'ลงวันที่ ' + esc(d.date) + '<br>'
      + '<span class="tiny">บันทึกลงทะเบียนหนังสือส่งเรียบร้อยแล้ว</span>'
      + '<button class="btn grey" id="sAgain" style="margin-top:12px">'
      + 'ตกลง — ขอเลขต่อไป</button>';
    $('sAgain').onclick = sendAgain;
  } catch (e) {
    m.className = 'err'; m.classList.remove('hidden');
    m.textContent = e.message;
    b.disabled = false; b.textContent = 'ขอเลข';
  }
};
</script>
</body>
</html>
