# ปลุกเว็บบน Render ให้ตื่นก่อนเวลาเข้างาน (เริ่มงาน ๘:๐๐)
#
# ทำไมต้องมีทั้งที่มี cron-job.org อยู่แล้ว
# ------------------------------------------------------------------
# Render ฟรีหลับเองเมื่อไม่มีคนเข้า ๑๕ นาที และตอนตื่นใช้เวลา ~๖๐-๙๐ วินาที
# (image นี้หนัก - PyMuPDF + google-api + ฟอนต์ไทย)
# แต่ cron-job.org ตัดการเชื่อมต่อที่ ๓๐ วินาที การปลุกครั้งแรกของวันจึงถูก
# ตัดกลางคันทุกครั้ง เว็บเลยไม่ตื่นจนกว่าจะมีคนเปิดเบราว์เซอร์แล้วรอจนสุด
#
# ที่นี่ใช้ curl --max-time 180 ซึ่ง "ถือสายรอ" จนบูตเสร็จได้จริง
#
# เรื่องเวลา — ของเดิมตั้งไว้ ๗ โมง แต่มันมาปลุกตอน ๙ โมงทุกวัน
# ------------------------------------------------------------------
# cron ของ GitHub Actions เป็น UTC เสมอ (ไทย = UTC+7)
# ของเดิมตั้ง '*/10 0 * * 1-5' = ๖ รอบ ช่วง ๗:๐๐-๗:๕๐ ไทย แต่ของจริงที่เกิดขึ้นคือ
#
#     พุธ ๒/๙  ๘:๕๙ ไทย   (ช้า ๑๑๙ นาที)
#     พฤ  ๓/๙  ๙:๐๔ ไทย   (ช้า ๑๒๔ นาที)
#     ศุกร์ ๔/๙ ๙:๐๐ ไทย   (ช้า ๑๒๐ นาที)
#
# คือได้วันละรอบเดียว (อีก ๕ รอบถูกทิ้ง) และช้าราวสองชั่วโมงทุกวัน
# เพราะ GitHub ไม่รับประกันว่า cron จะตรงเวลา — เข้าคิวรวมกันทั้งโลก
# แล้ว "นาทีที่ ๐ ของชั่วโมง" คือช่วงที่คนตั้งไว้เยอะที่สุด คิวจึงยาวที่สุด
# ยิ่งตั้งถี่ (ทุก ๑๐ นาที) ยิ่งโดนตัดทิ้งเหลือรอบเดียว
#
# แก้สองชั้น:
#   ๑. ย้ายไปนาทีแปลกๆ ที่คนไม่ค่อยตั้ง และกระจายเป็น ๔ เวลาห่างกัน
#      ตั้งแต่ตี ๕ ครึ่ง ถึงเกือบ ๘ โมง — ช้าไปบ้างก็ยังมีรอบที่ทันเวลาเข้างาน
#   ๒. รอบไหนปลุกติดแล้ว ให้ "เฝ้า" ยิงซ้ำทุก ๔ นาทีจนถึง ๘:๔๐ ไทย
#      (ไม่เกินครึ่งชั่วโมง) เว็บจะได้ไม่หลับซ้ำในช่องว่างก่อนคนมาถึง
#
# ข้อควรรู้: ถ้า repo ไม่มีความเคลื่อนไหวติดกัน ๖๐ วัน GitHub จะปิด
# ตารางนี้เอง ต้องเข้าไปกดเปิดใหม่ที่แท็บ Actions

name: wake-render

on:
  schedule:
    # เวลา UTC | เวลาไทย — วันในสัปดาห์ต้องเลื่อนตามด้วยเมื่อข้ามเที่ยงคืน UTC
    - cron: '23 22 * * 0-4'    # ๐๕:๒๓ ไทย (จ-ศ)
    - cron: '17 23 * * 0-4'    # ๐๖:๑๗ ไทย (จ-ศ)
    - cron: '11 0 * * 1-5'     # ๐๗:๑๑ ไทย (จ-ศ)
    - cron: '43 0 * * 1-5'     # ๐๗:๔๓ ไทย (จ-ศ)
  # กดปลุกเองได้จากแท็บ Actions -> wake-render -> Run workflow
  workflow_dispatch:

# ถ้ารอบก่อนหน้ายังเฝ้าอยู่แล้วรอบใหม่มาถึง ให้รอบใหม่ทำแทน ไม่ต้องซ้อนกัน
concurrency:
  group: wake-render
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      URL: https://saraban.onrender.com/healthz
      HOLD_UNTIL: "0840"        # เฝ้าถึงกี่โมง (เวลาไทย) — คนมาถึงแล้วก็พอ
      HOLD_MAX_MIN: "30"        # แต่ไม่เกินกี่นาที กันรอบที่มาเช้ามากเฝ้ายาว
    steps:
      - name: ping healthz then hold awake until work starts
        run: |
          set -u
          now_th() { TZ=Asia/Bangkok date '+%H:%M'; }

          ok=0
          for i in 1 2 3; do
            echo "--- ปลุกครั้งที่ $i ($(now_th) ไทย) ---"
            # --max-time 180 คือหัวใจ: ยอมถือสายรอ ๓ นาที ให้ Render บูตจนเสร็จ
            out=$(curl -sS -o /tmp/body.txt -w '%{http_code} ใช้เวลา %{time_total}s' \
                       --max-time 180 "$URL") || out="ยิงไม่ติด"
            echo "$out"
            echo "ตอบกลับ: $(cat /tmp/body.txt 2>/dev/null)"
            case "$out" in
              200*) ok=1; break ;;
            esac
            sleep 15
          done

          if [ "$ok" != "1" ]; then
            echo "ปลุกไม่ขึ้นหลังพยายาม ๓ ครั้ง"
            exit 1
          fi
          echo "ตื่นแล้ว เมื่อ $(now_th) ไทย"

          # เฝ้าไม่ให้หลับซ้ำ — Render หลับเมื่อไม่มีคนเข้า ๑๕ นาที จึงยิงทุก ๔ นาที
          end=$(( $(date -u +%s) + HOLD_MAX_MIN * 60 ))
          while [ "$(date -u +%s)" -lt "$end" ]; do
            if [ "$(TZ=Asia/Bangkok date '+%H%M')" -ge "$HOLD_UNTIL" ]; then
              echo "ถึงเวลาเข้างานแล้ว เลิกเฝ้า"
              break
            fi
            sleep 240
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL") || code="ยิงไม่ติด"
            echo "$(now_th) ไทย -> $code"
          done
