# ปลุกเว็บบน Render ให้ตื่นก่อนเวลาเข้างาน (เริ่มงาน ๘:๐๐)
#
# ทำไมต้องมีทั้งที่มี cron-job.org อยู่แล้ว
# ------------------------------------------------------------------
# Render ฟรีหลับเองเมื่อไม่มีคนเข้า ๑๕ นาที และตอนตื่นใช้เวลา ~๖๐-๙๐ วินาที
# (image นี้หนัก - PyMuPDF + google-api + ฟอนต์ไทย)
# แต่ cron-job.org ตัดการเชื่อมต่อที่ ๓๐ วินาที การปลุกครั้งแรกของวันจึงถูก
# ตัดกลางคันทุกครั้ง เว็บเลยไม่ตื่นจนกว่าจะมีคนเปิดเบราว์เซอร์แล้วรอจนสุด
#
# ที่นี่ใช้ curl --max-time 180 ซึ่ง "ถือสายรอ" จนบูตเสร็จได้จริง
# พอตื่นแล้ว cron-job.org (ยิงทุก ๑๐ นาที ๗:๐๐-๑๘:๕๙) เลี้ยงต่อได้สบาย
#
# เรื่องเวลา
# ------------------------------------------------------------------
# cron ของ GitHub Actions เป็น UTC เสมอ เปลี่ยนเขตเวลาไม่ได้
#   ไทย = UTC+7   ->   00:00 UTC = ๗ โมงเช้าบ้านเรา
# เข้างาน ๘:๐๐ จึงเริ่มปลุกตั้งแต่ ๗ โมง เผื่อไว้เต็มชั่วโมง เพราะ GitHub
# มักยิงช้ากว่าเวลาที่ตั้ง ๕-๒๐ นาที และบางรอบข้ามไปเลย จึงยิงซ้ำหลายครั้ง
#
# ข้อควรรู้: ถ้า repo ไม่มีความเคลื่อนไหวติดกัน ๖๐ วัน GitHub จะปิด
# ตารางนี้เอง ต้องเข้าไปกดเปิดใหม่ที่แท็บ Actions

name: wake-render

on:
  schedule:
    # ทุก ๑๐ นาทีในชั่วโมง 00 UTC = ๗:๐๐-๗:๕๐ ไทย จันทร์-ศุกร์
    - cron: '*/10 0 * * 1-5'
  # กดปลุกเองได้จากแท็บ Actions -> wake-render -> Run workflow
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: ping /healthz then wait until awake
        run: |
          URL=https://saraban.onrender.com/healthz
          for i in 1 2 3; do
            echo "--- ครั้งที่ $i  ($(date -u '+%H:%M:%S') UTC) ---"
            # --max-time 180 คือหัวใจ: ยอมถือสายรอ ๓ นาที ให้ Render บูตจนเสร็จ
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code} ใช้เวลา %{time_total}s' \
                        --max-time 180 "$URL") || code="ยิงไม่ติด"
            echo "$code"
            echo "ตอบกลับ: $(cat /tmp/body.txt)"
            if [ "${code%% *}" = "200" ]; then
              echo "ตื่นแล้ว"
              exit 0
            fi
            sleep 15
          done
          echo "ปลุกไม่ขึ้นหลังพยายาม ๓ ครั้ง"
          exit 1
